x-vnote-env: &vnote-env
  EDGE_EVER_RUNTIME: self-hosted-bun
  EDGE_EVER_VOS_MODE: "true"
  EDGE_EVER_VOS_USERINFO_URL: http://${VOS_HOST_GW_IP}:${VOS_API_GW_PORT_INTERNAL}/v1000/oauth2/userinfo
  EDGE_EVER_PUBLIC_BASE_PATH: /app/com.ictrek.v-note
  EDGE_EVER_SESSION_TTL_DAYS: ${VNOTE_SESSION_TTL_DAYS:-7}
  EDGE_EVER_AUTH_USERNAME: admin
  EDGE_EVER_AUTH_PASSWORD: ${VNOTE_BREAK_GLASS_PASSWORD:-}
  EDGE_EVER_DEPLOYMENT_METHOD: docker
  EDGE_EVER_DEPLOYMENT_TRIGGER: manual
  EDGE_EVER_DEMO_MODE: "false"

x-vnote-base: &vnote-base
  restart: unless-stopped
  init: true
  pull_policy: always
  networks:
    vos_default:
      aliases:
        - v-note-backend
  volumes:
    - ${VOS_APP_STORAGE_PATH}/data:/data
  ports:
    - "22710:8787"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s
  labels:
    - "traefik.enable=true"
    - "traefik.docker.network=vos_default"
    - "traefik.http.routers.v-note-app.rule=PathPrefix(`/app/com.ictrek.v-note`)"
    - "traefik.http.routers.v-note-app.middlewares=v-note-app-strip"
    - "traefik.http.middlewares.v-note-app-strip.stripprefix.prefixes=/app/com.ictrek.v-note"
    - "traefik.http.services.v-note-app.loadbalancer.server.port=8787"
  healthcheck:
    test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8787/api/health');if(!r.ok)process.exit(1)"]
    interval: 30s
    timeout: 10s
    start_period: 30s
    retries: 3

services:
  v-note-amd:
    <<: *vnote-base
    profiles: ["amd"]
    image: ${VNOTE_AMD_IMAGE}
    environment:
      <<: *vnote-env
      EDGE_EVER_CONTAINER_IMAGE: ${VNOTE_AMD_IMAGE}

  v-note-arm:
    <<: *vnote-base
    profiles: ["arm"]
    image: ${VNOTE_ARM_IMAGE}
    environment:
      <<: *vnote-env
      EDGE_EVER_CONTAINER_IMAGE: ${VNOTE_ARM_IMAGE}

networks:
  vos_default:
    external: true
