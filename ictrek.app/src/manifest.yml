id: com.ictrek.v-note
name:
  zh-CN: V-Note
  en: V-Note
description:
  zh-CN: 面向 VOS 的 AI 知识库与笔记工作区，支持多端写作、附件、搜索和 MCP。
  en: VOS-native AI knowledge base and notes workspace with rich editing, attachments, search, and MCP.
version: __APP_VERSION__
author: ictrek
oauth2:
  client:
    id: com.ictrek.v-note
    client_type: public
    grant_types: [authorization_code, refresh_token]
    response_types: [code]
    scopes: [openid, profile, email]
    pkce_required: true
    token_endpoint_auth_method: none
category: [other]
icon: icon.png
arch: [amd64, arm64]

frontend:
  enabled: true
  basePath: /app/com.ictrek.v-note

platform:
  version: ">=3.0.0"

profiles:
  - name: amd
    title: {zh-CN: AMD64 CPU, en: AMD64 CPU}
    description: {zh-CN: AMD64 CPU 运行，不依赖 GPU。, en: AMD64 CPU runtime without a GPU dependency.}
    caps: {arch: amd64}
    conflicts: [arm]
  - name: arm
    title: {zh-CN: ARM64 CPU, en: ARM64 CPU}
    description: {zh-CN: ARM64 CPU 运行，不依赖 GPU。, en: ARM64 CPU runtime without a GPU dependency.}
    caps: {arch: arm64}
    conflicts: [amd]

require-profiles: true

storage:
  directories:
    - path: data
      uid: 1000
      gid: 1000
      mode: "0755"
